[build]
  command = "npm run build"
  publish = "dist/public"

# Redirect API calls to Render
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-APP-NAME.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
