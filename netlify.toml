[build]
  command = "npm run build"
  publish = "dist/public"

# Route API calls through the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
